[workspace]
resolver = "2"
members = ["crates/plate", "crates/plate-core", "crates/plate-native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
half = { version = "2", features = ["bytemuck"] }
parking_lot = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"

# xattr 0.2.3 (pulled in by gpui's http client) references libc::ENOATTR, which
# current libc no longer exposes on Linux. ENODATA is the Linux equivalent.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
