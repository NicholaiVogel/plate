[package]
name = "plate-core"
version.workspace = true
edition.workspace = true
description = "Media decoding, caching, color and review data for plate"

[dependencies]
plate-native = { path = "../plate-native" }
anyhow.workspace = true
half.workspace = true
parking_lot.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
ffmpeg-next = "9"
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "tga", "bmp", "hdr", "webp", "gif"] }
roxmltree = "0.20"
dirs = "6"
cpal = "0.18"
crossbeam-channel = "0.5"
tiny-skia = "0.11"
ab_glyph = "0.2"
